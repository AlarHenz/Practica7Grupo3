<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos Favoritos</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --bg-soft: #181818;
            --panel: #212121;
            --panel-2: #272727;
            --text: #f1f1f1;
            --muted: #aaaaaa;
            --accent: #ff0033;
            --card: #181818;
            --line: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            min-height: 100vh;
            background: var(--bg);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            background: rgba(15, 15, 15, 0.94);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-mark {
            width: 34px;
            height: 24px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .brand-spacer {
            color: var(--muted);
            font-weight: 600;
        }

        .content {
            width: min(1200px, calc(100% - 32px));
            margin: 28px auto 40px;
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 24px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 22px 18px;
            height: fit-content;
            position: sticky;
            top: 92px;
        }

        .panel h2,
        .section-head h2 {
            margin: 0 0 18px;
            font-size: 1.4rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            border: 1px solid var(--line);
            outline: none;
            border-radius: 12px;
            background: var(--bg-soft);
            color: var(--text);
            padding: 12px 14px;
            font-size: 0.98rem;
        }

        .form-group input:focus {
            border-color: rgba(255, 0, 51, 0.8);
            box-shadow: 0 0 0 2px rgba(255, 0, 51, 0.15);
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff0033, #ff4d6d);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .submit-btn:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .videos-section {
            background: transparent;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-head span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: transparent;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-3px);
        }

        .thumbnail-link {
            position: relative;
            display: block;
            border-radius: 16px;
            overflow: hidden;
            background: var(--panel-2);
            aspect-ratio: 16 / 9;
        }

        .thumbnail-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .time-badge {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            border-radius: 6px;
            padding: 5px 7px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .video-info {
            padding: 10px 4px 0;
        }

        .video-info h3 {
            margin: 0 0 6px;
            font-size: 1.04rem;
            line-height: 1.35;
            color: var(--text);
        }

        .channel, .added-by {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .added-by {
            margin-top: 6px;
        }

        .added-by strong {
            color: var(--text);
            font-weight: 600;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 28px 18px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            text-align: center;
            color: var(--muted);
            background: rgba(255,255,255,0.02);
        }

        @media (max-width: 860px) {
            .content {
                grid-template-columns: 1fr;
            }

            .panel {
                position: static;
            }

            .topbar {
                padding-inline: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">▶</div>
                <span>Videos Favoritos</span>
            </div>
            <div class="brand-spacer">By Diego Ramirez :)</div>
        </header>

        <main class="content">
            <aside class="panel">
                <h2>Agregar video</h2>
                <form id="videoForm">
                    <div class="form-group">
                        <label for="personName">Nombre de quien lo agrega</label>
                        <input id="personName" type="text" maxlength="40" placeholder="Ej. Diego" required>
                    </div>

                    <div class="form-group">
                        <label for="videoUrl">Link del video de YouTube</label>
                        <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
                    </div>

                    <button class="submit-btn" type="submit">Agregar video</button>
                </form>
            </aside>

            <section class="videos-section">
                <div class="section-head">
                    <h2>Recientes</h2>
                    <span id="totalVideos">0 videos</span>
                </div>
                <div id="videoList" class="video-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const STORAGE_KEY = 'youtube-video-gallery-v1';

        const defaultVideos = [
            {
                id: 'dQw4w9WgXcQ',
                title: 'Rick Astley - Never Gonna Give You Up',
                author: 'Rick Astley',
                addedBy: 'Diego',
                url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                thumbnail: 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg'
            },
            {
                id: 'ysz5S6PUM-U',
                title: 'Adele - Hello',
                author: 'Adele',
                addedBy: 'Rosa',
                url: 'https://www.youtube.com/watch?v=ysz5S6PUM-U',
                thumbnail: 'https://i.ytimg.com/vi/ysz5S6PUM-U/hqdefault.jpg'
            },
            {
                id: 'ScMzIvxBSi4',
                title: 'Official Trailer',
                author: 'Movie Channel',
                addedBy: 'Luis',
                url: 'https://www.youtube.com/watch?v=ScMzIvxBSi4',
                thumbnail: 'https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg'
            }
        ];

        function safeText(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function extractYouTubeId(url) {
            const trimmed = url.trim();
            if (!trimmed) return null;

            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([A-Za-z0-9_-]{11})/,
                /[?&]v=([A-Za-z0-9_-]{11})/
            ];

            for (const pattern of patterns) {
                const match = trimmed.match(pattern);
                if (match && match[1]) return match[1];
            }

            return null;
        }

        function getInitialVideos() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length) {
                        return parsed;
                    }
                }
            } catch (error) {
                console.warn('No se pudieron leer los videos guardados:', error);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultVideos));
            return defaultVideos;
        }

        const videos = getInitialVideos();

        function saveVideos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        }

        function renderVideos() {
            const list = document.getElementById('videoList');
            const total = document.getElementById('totalVideos');

            if (!videos.length) {
                list.innerHTML = '<div class="empty-state">Aún no hay videos agregados. ¡Agrega el primero!</div>';
                total.textContent = '0 videos';
                return;
            }

            list.innerHTML = videos.map((video) => `
                <article class="video-card">
                    <a class="thumbnail-link" href="${safeText(video.url)}" target="_blank" rel="noreferrer">
                        <img src="${safeText(video.thumbnail)}" alt="${safeText(video.title)}" loading="lazy">
                        <span class="time-badge">Video</span>
                    </a>
                    <div class="video-info">
                        <h3>${safeText(video.title)}</h3>
                        <p class="channel">${safeText(video.author || 'Canal de YouTube')}</p>
                        <p class="added-by">Agregado por: <strong>${safeText(video.addedBy)}</strong></p>
                    </div>
                </article>
            `).join('');

            total.textContent = `${videos.length} video${videos.length === 1 ? '' : 's'}`;
        }

        async function fetchVideoMeta(videoId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if (!response.ok) throw new Error('Error de red');

                const data = await response.json();
                return {
                    title: data.title || 'Video de YouTube',
                    author: data.author_name || 'Canal de YouTube'
                };
            } catch (error) {
                return {
                    title: 'Video de YouTube',
                    author: 'Canal de YouTube'
                };
            }
        }

        document.getElementById('videoForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const personName = document.getElementById('personName').value.trim();
            const urlValue = document.getElementById('videoUrl').value.trim();
            const videoId = extractYouTubeId(urlValue);

            if (!personName) {
                alert('Escribe el nombre de la persona que agrega el video.');
                return;
            }

            if (!videoId) {
                alert('Ingresa un enlace válido de YouTube.');
                return;
            }

            const newVideo = {
                id: videoId,
                title: 'Video de YouTube',
                author: 'Canal de YouTube',
                addedBy: personName,
                url: `https://www.youtube.com/watch?v=${videoId}`,
                thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
            };

            videos.unshift(newVideo);
            saveVideos();
            renderVideos();
            event.target.reset();

            const meta = await fetchVideoMeta(videoId);
            const savedVideo = videos.find((video) => video.id === videoId && video.addedBy === personName && video.title === 'Video de YouTube');

            if (savedVideo) {
                savedVideo.title = meta.title;
                savedVideo.author = meta.author;
                saveVideos();
                renderVideos();
            }
        });

        renderVideos();
    </script>
</body>
</html>
