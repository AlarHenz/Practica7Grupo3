<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-primary text-white text-center py-3 rounded-top-3">
                        <h4 class="mb-0">Registro de Usuario</h4>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="post">
                            <!-- Fila para Nombre y Apellido -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Nombre" required>
                                        <label for="nombre">Nombre</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" name="apellido" id="apellido" placeholder="Apellido" required>
                                        <label for="apellido">Apellido</label>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Correo y Teléfono -->
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" name="correo" id="correo" placeholder="nombre@ejemplo.com" required>
                                <label for="correo">Correo Electrónico</label>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <div class="form-floating">
                                        <input type="tel" class="form-control" name="telefono" id="telefono" placeholder="Teléfono">
                                        <label for="telefono">Teléfono</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="form-floating">
                                        <input type="date" class="form-control" name="fecha_nac" id="fecha_nac" required>
                                        <label for="fecha_nac">Fecha de Nacimiento</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Opciones de Selección -->
                            <div class="form-floating mb-3">
                                <select class="form-select" id="departamento" name="departamento" aria-label="Seleccione un departamento">
                                    <option selected disabled value="">Seleccione una opción...</option>
                                    <option value="SA">Santa Ana</option>
                                    <option value="SS">San Salvador</option>
                                    <option value="SM">San Miguel</option>
                                    <option value="OT">Otro</option>
                                </select>
                                <label for="departamento">Departamento</label>
                            </div>

                            <!-- Botones de Radio para Género -->
                            <div class="mb-3 px-2">
                                <label class="form-label d-block text-secondary mb-2">Género</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="masculino" value="M">
                                    <label class="form-check-label" for="masculino">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="femenino" value="F">
                                    <label class="form-check-label" for="femenino">Femenino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="otro" value="O">
                                    <label class="form-check-label" for="otro">Otro</label>
                                </div>
                            </div>

                            <!-- Área de Texto -->
                            <div class="form-floating mb-4">
                                <textarea class="form-control" placeholder="Deje un comentario" id="comentarios" name="comentarios" style="height: 100px"></textarea>
                                <label for="comentarios">Comentarios adicionales</label>
                            </div>

                            <!-- Checkbox de Términos -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" value="1" id="terminos" required>
                                <label class="form-check-label text-muted" for="terminos">
                                    Acepto los términos y condiciones de uso.
                                </label>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
                                <button type="reset" class="btn btn-outline-secondary">Limpiar Formulario</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
