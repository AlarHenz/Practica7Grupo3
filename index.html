<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Práctica 7</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: #ffffff;

            background:
                radial-gradient(circle at 20% 20%, rgba(65, 105, 225, 0.15), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(120, 70, 200, 0.12), transparent 35%),
                #080a0f;

            overflow: hidden;
        }

        /* Brillo decorativo */
        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;

            background: rgba(60, 120, 255, 0.08);
            filter: blur(100px);

            top: -180px;
            right: -120px;
        }

        .container {
            position: relative;
            width: min(850px, 90%);
            padding: 70px 60px;

            text-align: center;

            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(12px);
        }

        .label {
            margin-bottom: 18px;

            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: #6ea8ff;
        }

        h1 {
            font-size: clamp(4rem, 10vw, 8rem);
            line-height: 0.95;
            font-weight: 700;
            letter-spacing: -5px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #b9c8e8
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin-top: 28px;

            font-size: 17px;
            line-height: 1.6;

            color: rgba(255, 255, 255, 0.42);
        }

        .line {
            width: 55px;
            height: 2px;

            margin: 35px auto 0;

            background: #5f9cff;
            border-radius: 10px;

            box-shadow: 0 0 15px rgba(95, 156, 255, 0.7);
        }

        @media (max-width: 600px) {
            .container {
                padding: 50px 25px;
            }

            h1 {
                letter-spacing: -3px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="label">
            AMACCS
        </div>

        <h1>Práctica 7</h1>

        <p>
            Desarrollo de la práctica 7 en AMACCS.
        </p>

        <div class="line"></div>

    </main>

</body>
</html>
